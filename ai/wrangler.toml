# BFF AI server (deployed by .github/workflows/ai.yml when the Cloudflare secrets are set; see README "Ask BFF AI")
name = "bff-ai"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
# the models Ask BFF uses on Cloudflare's free tier (Workers AI); the second answers when the first errors.
# gpt-oss-120b (OpenAI's open-weight model) is the smartest free-plan model for its cost: roughly 50 to 90 questions a
# day fit in the free 10,000 Neurons. For more questions a day, swap the two: qwen3-30b fits about four times as many.
MODEL = "@cf/openai/gpt-oss-120b"
FALLBACK_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
# set by the workflow from the repository's GitHub Pages address (and CNAME, if the site has its own domain)
ALLOWED_ORIGINS = ""
