# BFF AI server: deploys ai/worker.js to Cloudflare (free tier) and tells the site where it is (ai.json).
# Does nothing until the repository has two secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (README: "Ask BFF AI").
name: BFF AI server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ai/**', '.github/workflows/ai.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: bff-ai
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Cloudflare secrets
        id: s
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::BFF AI server not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README, Ask BFF AI). Ask BFF keeps working without it."; fi
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == '1'
        with:
          node-version: '20'
      - name: Deploy the Worker
        id: d
        if: steps.s.outputs.ok == '1'
        working-directory: ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          ORIGINS="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          if [ -f ../CNAME ]; then D=$(tr -d ' \r\n' < ../CNAME); [ -n "$D" ] && ORIGINS="$ORIGINS,https://$D"; fi
          echo "Allowed pages: $ORIGINS"
          npx --yes wrangler@4.149.0 deploy --var "ALLOWED_ORIGINS:$ORIGINS" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::error::Deployed, but no workers.dev address in the output. Open Workers & Pages in the Cloudflare dashboard once so the account gets its workers.dev subdomain, then run this again."; exit 1; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "origin=${ORIGINS%%,*}" >> "$GITHUB_OUTPUT"
          echo "model=$(grep -E '^MODEL *=' wrangler.toml | head -1 | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
      - name: Check that it answers
        id: t
        if: steps.s.outputs.ok == '1'
        env:
          URL: ${{ steps.d.outputs.url }}
          ORIGIN: ${{ steps.d.outputs.origin }}
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            sleep 10
            R=$(curl -s -m 60 -X POST "$URL/ask" -H "Origin: $ORIGIN" -H 'content-type: application/json' \
              -d '{"v":1,"m":[{"role":"user","content":"FACTS:\nNow: a test from the deploy workflow.\n\nQUESTION: In one short sentence: how many points is a touchdown worth?"}]}' || true)
            echo "reply: $R"
            if echo "$R" | python3 -c 'import json,sys; j=json.load(sys.stdin); sys.exit(0 if isinstance(j.get("a"),str) and j["a"].strip() else 1)'; then ok=1; break; fi
            if echo "$R" | grep -q '"quota"'; then echo "::warning::Today's free allowance is used up; the server is deployed and will answer after 00:00 UTC."; ok=1; break; fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = 1 ] || echo "::error::The Worker deployed but did not answer. Check Workers & Pages > bff-ai > Logs in the Cloudflare dashboard."
      - name: Tell the site (ai.json)
        if: steps.s.outputs.ok == '1'
        env:
          URL: ${{ steps.d.outputs.url }}
          MODEL: ${{ steps.d.outputs.model }}
          OK: ${{ steps.t.outputs.ok }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          ok = os.environ.get('OK') == '1'
          json.dump({'url': os.environ['URL'], 'model': os.environ.get('MODEL', ''), 'ok': ok, 'at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='minutes')}, open('ai.json', 'w'), indent=1)
          print(open('ai.json').read())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add ai.json
          if git diff --cached --quiet; then echo "ai.json unchanged"; exit 0; fi
          git commit -m "BFF AI server: $( [ "$OK" = 1 ] && echo on || echo not answering ) ($URL)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Rebuild the page with the AI server on
        if: steps.s.outputs.ok == '1' && steps.t.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update.yml --ref main || echo "::notice::Run 'Update Gridiron Fantasy' once to put the AI server on the page."
