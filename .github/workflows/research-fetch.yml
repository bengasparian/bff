name: Research fetch (one-off, research-data branch only)
on:
  push:
    branches: [research-data]
    paths: ['hist_fetch.py', 'stat_fetch.py', '.github/workflows/research-fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch ESPN and Sleeper projections stat by stat
        run: python stat_fetch.py
      - name: Save
        run: |
          git config user.name "gridiron-fantasy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats
          git commit -m "Research data: ESPN and Sleeper projections by stat" || exit 0
          git push
