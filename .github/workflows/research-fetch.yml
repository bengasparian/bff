name: Research fetch (one-off, research-data branch only)
on:
  push:
    branches: [research-data]
    paths: ['cors_probe.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check whether a browser page may read ESPN's and Yahoo's league APIs
        run: python cors_probe.py
      - name: Save
        run: |
          git config user.name "gridiron-fantasy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats
          git commit -m "Research data: ESPN league API shape" || exit 0
          git push
