name: Update Gridiron Fantasy

# Runs on its own all year: it works out the season from the NFL schedule, retrains the projection model on the five
# latest completed seasons, and rebuilds the page. Nothing needs editing from one season to the next.
on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours, at 23 minutes past (the top of the hour is GitHub's busiest time)
  workflow_dispatch: {}

permissions:
  contents: write

# the score job and this job share one queue, so they never save at the same moment
concurrency:
  group: bff-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip                # reuses the downloaded libraries between runs instead of downloading them again
      - name: Install libraries (tested versions; the newest ones if those ever stop installing)
        run: pip install -r requirements.txt || pip install pandas pyarrow scikit-learn scipy
      - name: Reuse the model's feature tables from earlier runs
        uses: actions/cache@v5
        with:
          path: .cache
          key: bff-features-${{ hashFiles('ff_build2.py', 'ff_feat.py') }}-${{ github.run_id }}
          restore-keys: bff-features-${{ hashFiles('ff_build2.py', 'ff_feat.py') }}-
      - name: This week's cache name
        id: wk
        run: echo "k=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Reuse this week's downloads of completed seasons (they do not change; refreshed weekly)
        uses: actions/cache@v5
        with:
          path: |
            pbp_20*.parquet
            stats_player_week_20*.parquet
            snap_counts_20*.parquet
            roster_weekly_20*.parquet
            injuries_20*.parquet
            depth_charts_20*.parquet
          key: bff-seasons-${{ steps.wk.outputs.k }}
      - name: Download data (works out the season on its own)
        id: fetch
        run: python fetch_data.py
      - name: Build projections and collect news
        id: produce
        run: python ff_produce.py
      - name: Sync Sleeper league (optional)
        id: sleeper
        env:
          SLEEPER_LEAGUE_ID: ${{ vars.SLEEPER_LEAGUE_ID }}
        run: python sync_sleeper.py
      - name: Predicted prop lines and parlay picks
        id: lines
        run: |
          python ff_lines.py
          python parlay_update.py
      - name: Weekly calls (lock at kickoff, grade with official stats)
        id: calls
        run: python calls_update.py
      - name: Build the page (accounts turn on when BFF_FIREBASE is set; see README)
        id: page
        env:
          BFF_FIREBASE: ${{ vars.BFF_FIREBASE }}
          BFF_TERMS_STATE: ${{ vars.BFF_TERMS_STATE }}
          BFF_CONTACT: ${{ vars.BFF_CONTACT }}
        run: python assemble.py
      - name: BFF Originals (game previews, recaps and breaking news; a failure is reported at the end of the run)
        id: articles
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BFF_AI_MODEL: ${{ vars.BFF_AI_MODEL }}
          BFF_AI_MAX_DAY: ${{ vars.BFF_AI_MAX_DAY }}
        run: python articles.py
      - name: Put the newest BFF Originals in the page
        env:
          BFF_FIREBASE: ${{ vars.BFF_FIREBASE }}
          BFF_TERMS_STATE: ${{ vars.BFF_TERMS_STATE }}
          BFF_CONTACT: ${{ vars.BFF_CONTACT }}
        run: python assemble.py
      - name: Check the page before saving (keeps the last good page if anything is wrong)
        id: check
        run: |
          python check_page.py
          python check_page.py --json
      - name: Save the updated page
        id: save
        run: |
          git config user.name "gridiron-fantasy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in index.html art proj_history.json parlay_history.json calls_history.json bet_inputs.json lines.json parlays.json news.json news_state.json articles.json proj_compare.json; do if [ -e "$f" ]; then git add -A "$f"; fi; done
          if git diff --cached --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "Data update $(date -u +%F-%H%M)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            echo "Save attempt $i did not go through; retrying"; sleep $((i*15))
          done
          exit 1
      - name: Health report (runs even when a step failed; also keeps the scheduled jobs from being paused)
        if: always()
        env:
          STEP_FETCH: ${{ steps.fetch.outcome }}
          STEP_PRODUCE: ${{ steps.produce.outcome }}
          STEP_LINES: ${{ steps.lines.outcome }}
          STEP_CALLS: ${{ steps.calls.outcome }}
          STEP_PAGE: ${{ steps.page.outcome }}
          STEP_ARTICLES: ${{ steps.articles.outcome }}
          STEP_CHECK: ${{ steps.check.outcome }}
          STEP_SAVE: ${{ steps.save.outcome }}
        run: |
          python health.py
          git config user.name "gridiron-fantasy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Health $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            sleep $((i*15))
          done
          echo "Could not save the health report this time"; exit 0
      - name: Report a failed BFF Originals step (the page and data were saved; this makes GitHub email you)
        if: steps.articles.outcome == 'failure'
        run: |
          echo "::error::BFF Originals (articles.py) failed this run. The page and data were saved; see the BFF Originals step above."
          exit 1
